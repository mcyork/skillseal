<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#2563EB"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#7C3AED"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#059669"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#DC2626"/>
    </marker>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="300" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" letter-spacing="0.5">Hook Enforcement</text>
  <rect x="340" y="38" width="280" height="1.5" fill="url(#hdr)" rx="1"/>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748B">PreToolUse hook intercepts every skill invocation</text>

  <!-- Step 1: User -->
  <circle cx="40" cy="128" r="22" fill="#DBEAFE" stroke="#93C5FD" stroke-width="1.5" filter="url(#s)"/>
  <text x="40" y="125" text-anchor="middle" font-size="14" fill="#1E3A8A">&#128100;</text>
  <text x="40" y="140" text-anchor="middle" font-size="7" font-weight="700" fill="#1E3A8A">USER</text>

  <!-- Arrow 1-2 -->
  <line x1="66" y1="128" x2="90" y2="128" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Claude Code Agent -->
  <rect x="98" y="104" width="112" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="98" y="104" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="158" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Claude Code</text>
  <text x="158" y="140" text-anchor="middle" font-size="10" fill="#64748B">agent</text>

  <!-- Arrow 2-3 -->
  <line x1="216" y1="128" x2="240" y2="128" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: PreToolUse Hook -->
  <rect x="248" y="104" width="120" height="48" rx="6" fill="#EDE9FE" stroke="#C4B5FD" filter="url(#s)"/>
  <rect x="248" y="104" width="4" height="48" rx="2 0 0 2" fill="#7C3AED"/>
  <text x="312" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">PreToolUse</text>
  <text x="312" y="140" text-anchor="middle" font-size="10" fill="#7C3AED">hook fires</text>

  <!-- Arrow 3-4 -->
  <line x1="374" y1="128" x2="398" y2="128" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 4: Parse + Resolve -->
  <rect x="406" y="104" width="116" height="48" rx="6" fill="#EDE9FE" stroke="#C4B5FD" filter="url(#s)"/>
  <rect x="406" y="104" width="4" height="48" rx="2 0 0 2" fill="#7C3AED"/>
  <text x="468" y="125" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">Parse stdin</text>
  <text x="468" y="140" text-anchor="middle" font-size="10" fill="#7C3AED">resolve skill dir</text>

  <!-- Arrow 4-5 -->
  <line x1="528" y1="128" x2="552" y2="128" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr-p)"/>

  <!-- Step 5: skillseal verify -->
  <rect x="560" y="104" width="114" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="560" y="104" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="621" y="121" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">skillseal</text>
  <text x="621" y="136" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">verify</text>

  <!-- Arrow 5-6 -->
  <line x1="680" y1="128" x2="704" y2="128" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 6: Policy Decision (diamond) -->
  <polygon points="756,94 806,128 756,162 706,128" fill="#fff" stroke="#C4B5FD" stroke-width="1.5" filter="url(#s)"/>
  <text x="756" y="125" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">Policy</text>
  <text x="756" y="137" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">result?</text>

  <!-- Arrow to ALLOW (exit 0) -->
  <line x1="806" y1="116" x2="852" y2="96" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>
  <text x="836" y="98" font-size="9" fill="#059669" font-weight="600">exit 0</text>

  <!-- Arrow to BLOCK (exit 2) -->
  <line x1="806" y1="140" x2="852" y2="160" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-r)"/>
  <text x="836" y="162" font-size="9" fill="#DC2626" font-weight="600">exit 2</text>

  <!-- ALLOW box -->
  <rect x="860" y="76" width="82" height="36" rx="6" fill="#059669"/>
  <text x="901" y="90" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Skill</text>
  <text x="901" y="103" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">executes</text>

  <!-- BLOCK box -->
  <rect x="860" y="144" width="82" height="36" rx="6" fill="#DC2626"/>
  <text x="901" y="158" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">Skill</text>
  <text x="901" y="171" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">blocked</text>

  <!-- Phase labels -->
  <rect x="98" y="190" width="130" height="22" rx="4" fill="#EFF6FF" opacity="0.5"/>
  <text x="163" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">INVOCATION</text>
  <rect x="248" y="190" width="274" height="22" rx="4" fill="#F5F3FF" opacity="0.5"/>
  <text x="385" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#5B21B6" letter-spacing="0.5">HOOK ENFORCEMENT</text>
  <rect x="560" y="190" width="382" height="22" rx="4" fill="#F0FDF4" opacity="0.5"/>
  <text x="751" y="205" text-anchor="middle" font-size="10" font-weight="600" fill="#065F46" letter-spacing="0.5">VERIFICATION + DECISION</text>

  <!-- Flow description -->
  <text x="480" y="240" text-anchor="middle" font-size="11" fill="#64748B">Hook runs before every tool use — unsigned or untrusted skills are blocked automatically</text>

  <!-- Footer -->
  <text x="480" y="280" text-anchor="middle" font-size="10" fill="#94A3B8">SkillSeal  ·  Cryptographic Trust for LLM Agent Skills</text>
</svg>