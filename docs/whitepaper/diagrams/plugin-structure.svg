<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="740" height="520" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="370" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" letter-spacing="0.5">Plugin Structure</text>
  <rect x="240" y="38" width="260" height="1.5" fill="url(#hdr)" rx="1"/>
  <text x="370" y="56" text-anchor="middle" font-size="12" fill="#64748B">Directory layout and signing relationships for a SkillSeal plugin</text>

  <!-- ═══ Directory Tree (Left Panel) ═══ -->
  <rect x="24" y="76" width="420" height="400" rx="8" fill="#fff" stroke="#E2E8F0" filter="url(#s)"/>
  <rect x="24" y="76" width="420" height="4" rx="2 2 0 0" fill="#2563EB"/>

  <rect x="40" y="88" width="140" height="20" rx="10" fill="#EFF6FF"/>
  <text x="110" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Directory Layout</text>

  <!-- Root folder -->
  <text x="52" y="136" font-size="14" fill="#F59E0B">&#128193;</text>
  <text x="72" y="136" font-size="13" font-weight="700" fill="#1E293B">my-plugin/</text>

  <!-- .claude-plugin/ -->
  <text x="80" y="164" font-size="11" fill="#94A3B8">├──</text>
  <text x="110" y="164" font-size="14" fill="#7C3AED">&#128193;</text>
  <text x="130" y="164" font-size="12" font-weight="600" fill="#5B21B6">.claude-plugin/</text>

  <!-- plugin.json -->
  <text x="110" y="192" font-size="11" fill="#94A3B8">│   └──</text>
  <text x="160" y="192" font-size="12" fill="#1E293B">plugin.json</text>
  <rect x="250" y="180" width="80" height="18" rx="9" fill="#EDE9FE"/>
  <text x="290" y="192" text-anchor="middle" font-size="9" font-weight="600" fill="#5B21B6">signed artifact</text>

  <!-- skills/ -->
  <text x="80" y="222" font-size="11" fill="#94A3B8">├──</text>
  <text x="110" y="222" font-size="14" fill="#3B82F6">&#128193;</text>
  <text x="130" y="222" font-size="12" font-weight="600" fill="#2563EB">skills/</text>

  <!-- skill files -->
  <text x="110" y="248" font-size="11" fill="#94A3B8">│   ├──</text>
  <text x="160" y="248" font-size="12" fill="#64748B">analyze.md</text>
  <text x="110" y="272" font-size="11" fill="#94A3B8">│   └──</text>
  <text x="160" y="272" font-size="12" fill="#64748B">report.md</text>

  <!-- commands/ -->
  <text x="80" y="302" font-size="11" fill="#94A3B8">├──</text>
  <text x="110" y="302" font-size="14" fill="#3B82F6">&#128193;</text>
  <text x="130" y="302" font-size="12" font-weight="600" fill="#2563EB">commands/</text>

  <!-- command files -->
  <text x="110" y="328" font-size="11" fill="#94A3B8">│   └──</text>
  <text x="160" y="328" font-size="12" fill="#64748B">run.sh</text>

  <!-- MANIFEST.json -->
  <text x="80" y="362" font-size="11" fill="#94A3B8">├──</text>
  <text x="110" y="362" font-size="12" font-weight="600" fill="#D97706">MANIFEST.json</text>
  <rect x="238" y="350" width="100" height="18" rx="9" fill="#FFFBEB"/>
  <text x="288" y="362" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">file hash digests</text>

  <!-- TRUST.json -->
  <text x="80" y="392" font-size="11" fill="#94A3B8">├──</text>
  <text x="110" y="392" font-size="12" font-weight="600" fill="#D97706">TRUST.json</text>
  <rect x="220" y="380" width="104" height="18" rx="9" fill="#FFFBEB"/>
  <text x="272" y="392" text-anchor="middle" font-size="9" font-weight="600" fill="#92400E">author identity</text>

  <!-- PLUGIN.sig -->
  <text x="80" y="422" font-size="11" fill="#94A3B8">└──</text>
  <text x="110" y="422" font-size="12" font-weight="600" fill="#059669">PLUGIN.sig</text>
  <rect x="212" y="410" width="110" height="18" rx="9" fill="#ECFDF5"/>
  <text x="267" y="422" text-anchor="middle" font-size="9" font-weight="600" fill="#059669">GPG detached sig</text>

  <!-- ═══ Signing Relationships (Right Panel) ═══ -->
  <rect x="464" y="76" width="252" height="272" rx="8" fill="#fff" stroke="#E2E8F0" filter="url(#s)"/>
  <rect x="464" y="76" width="252" height="4" rx="2 2 0 0" fill="#059669"/>

  <rect x="480" y="88" width="172" height="20" rx="10" fill="#F0FDF4"/>
  <text x="566" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">Signing Relationships</text>

  <!-- Relationship 1 -->
  <rect x="480" y="120" width="220" height="52" rx="6" fill="#ECFDF5" stroke="#BBF7D0"/>
  <text x="590" y="140" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">PLUGIN.sig</text>
  <text x="590" y="156" text-anchor="middle" font-size="10" fill="#059669">signs plugin.json</text>

  <!-- Relationship 2 -->
  <rect x="480" y="184" width="220" height="52" rx="6" fill="#ECFDF5" stroke="#BBF7D0"/>
  <text x="590" y="204" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">MANIFEST.json</text>
  <text x="590" y="220" text-anchor="middle" font-size="10" fill="#059669">covers all content files</text>

  <!-- Relationship 3 -->
  <rect x="480" y="248" width="220" height="52" rx="6" fill="#ECFDF5" stroke="#BBF7D0"/>
  <text x="590" y="268" text-anchor="middle" font-size="11" font-weight="600" fill="#065F46">TRUST.json</text>
  <text x="590" y="284" text-anchor="middle" font-size="10" fill="#059669">pins author GPG fingerprint</text>

  <!-- Coverage note -->
  <rect x="464" y="364" width="252" height="112" rx="8" fill="#fff" stroke="#E2E8F0" filter="url(#s)"/>
  <rect x="464" y="364" width="252" height="4" rx="2 2 0 0" fill="#F59E0B"/>

  <rect x="480" y="376" width="140" height="20" rx="10" fill="#FFFBEB"/>
  <text x="550" y="390" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Manifest Coverage</text>

  <text x="480" y="416" font-size="10" fill="#64748B">Manifest hashes cover:</text>
  <text x="492" y="434" font-size="10" fill="#1E293B">&#x2022; All skill files (skills/)</text>
  <text x="492" y="452" font-size="10" fill="#1E293B">&#x2022; All commands (commands/)</text>
  <text x="492" y="470" font-size="10" fill="#1E293B">&#x2022; Hooks and config files</text>

  <!-- Footer -->
  <text x="370" y="504" text-anchor="middle" font-size="10" fill="#94A3B8">SkillSeal  ·  Cryptographic Trust for LLM Agent Skills</text>
</svg>