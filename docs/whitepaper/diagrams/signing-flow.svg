<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#D97706"/>
    </marker>
    <marker id="arr-b" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#2563EB"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#059669"/>
    </marker>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="280" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" letter-spacing="0.5">Signing Flow</text>
  <rect x="340" y="38" width="280" height="1.5" fill="url(#hdr)" rx="1"/>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748B">From source files to a signed, verifiable skill package</text>

  <!-- Step 1: Author -->
  <circle cx="56" cy="132" r="24" fill="#FEF3C7" stroke="#FBBF24" stroke-width="1.5" filter="url(#s)"/>
  <text x="56" y="129" text-anchor="middle" font-size="16" fill="#92400E">&#9998;</text>
  <text x="56" y="144" text-anchor="middle" font-size="7" font-weight="700" fill="#92400E">AUTHOR</text>
  <text x="56" y="172" text-anchor="middle" font-size="10" fill="#64748B">Source files</text>

  <!-- Arrow 1-2 -->
  <line x1="84" y1="132" x2="114" y2="132" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- Step 2: Hash Files -->
  <rect x="122" y="108" width="108" height="48" rx="6" fill="#fff" stroke="#FDE68A" filter="url(#s)"/>
  <rect x="122" y="108" width="4" height="48" rx="2 0 0 2" fill="#F59E0B"/>
  <text x="180" y="129" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Hash all files</text>
  <text x="180" y="144" text-anchor="middle" font-size="10" fill="#64748B">SHA-256</text>
  <text x="180" y="172" text-anchor="middle" font-size="9" fill="#94A3B8">1</text>

  <!-- Arrow 2-3 -->
  <line x1="236" y1="132" x2="264" y2="132" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- Step 3: MANIFEST.json -->
  <rect x="272" y="108" width="116" height="48" rx="6" fill="#fff" stroke="#FDE68A" filter="url(#s)"/>
  <rect x="272" y="108" width="4" height="48" rx="2 0 0 2" fill="#F59E0B"/>
  <text x="334" y="129" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">MANIFEST.json</text>
  <text x="334" y="144" text-anchor="middle" font-size="10" fill="#64748B">File digests</text>
  <text x="334" y="172" text-anchor="middle" font-size="9" fill="#94A3B8">2</text>

  <!-- Arrow 3-4 -->
  <line x1="394" y1="132" x2="422" y2="132" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- Step 4: TRUST.json -->
  <rect x="430" y="108" width="108" height="48" rx="6" fill="#fff" stroke="#FDE68A" filter="url(#s)"/>
  <rect x="430" y="108" width="4" height="48" rx="2 0 0 2" fill="#F59E0B"/>
  <text x="488" y="129" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">TRUST.json</text>
  <text x="488" y="144" text-anchor="middle" font-size="10" fill="#64748B">Author identity</text>
  <text x="488" y="172" text-anchor="middle" font-size="9" fill="#94A3B8">3</text>

  <!-- Arrow 4-5 -->
  <line x1="544" y1="132" x2="572" y2="132" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Step 5: Canonical JSON -->
  <rect x="580" y="108" width="114" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="580" y="108" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="641" y="129" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Canonical JSON</text>
  <text x="641" y="144" text-anchor="middle" font-size="10" fill="#64748B">Deterministic</text>
  <text x="641" y="172" text-anchor="middle" font-size="9" fill="#94A3B8">4</text>

  <!-- Arrow 5-6 -->
  <line x1="700" y1="132" x2="728" y2="132" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Step 6: GPG Sign -->
  <rect x="736" y="108" width="100" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="736" y="108" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="790" y="129" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">GPG Sign</text>
  <text x="790" y="144" text-anchor="middle" font-size="10" fill="#64748B">Detached sig</text>
  <text x="790" y="172" text-anchor="middle" font-size="9" fill="#94A3B8">5</text>

  <!-- Arrow 6-7 -->
  <line x1="842" y1="132" x2="870" y2="132" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step 7: Signed Package -->
  <rect x="878" y="102" width="68" height="60" rx="8" fill="#059669" filter="url(#s)"/>
  <text x="912" y="130" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Signed</text>
  <text x="912" y="145" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">Package</text>
  <text x="912" y="178" text-anchor="middle" font-size="9" fill="#94A3B8">6</text>

  <!-- Phase labels -->
  <rect x="122" y="198" width="424" height="22" rx="4" fill="#FFFBEB" opacity="0.5"/>
  <text x="334" y="213" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E" letter-spacing="0.5">BUILD PHASE</text>
  <rect x="580" y="198" width="256" height="22" rx="4" fill="#EFF6FF" opacity="0.5"/>
  <text x="708" y="213" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">SIGN PHASE</text>

  <!-- Footer -->
  <text x="480" y="258" text-anchor="middle" font-size="10" fill="#94A3B8">SkillSeal  ·  Cryptographic Trust for LLM Agent Skills</text>
</svg>