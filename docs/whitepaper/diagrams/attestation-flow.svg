<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr-b" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#2563EB"/>
    </marker>
    <marker id="arr-a" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#D97706"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#059669"/>
    </marker>
    <marker id="arr-p" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#7C3AED"/>
    </marker>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="420" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" letter-spacing="0.5">Attestation Flow</text>
  <rect x="340" y="38" width="280" height="1.5" fill="url(#hdr)" rx="1"/>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748B">A trusted reviewer vouches for skill contents by signing an attestation</text>

  <!-- ═══ Row 1: CREATE PHASE (Steps 1-4) ═══ -->

  <!-- Step 1: Reviewer -->
  <circle cx="52" cy="118" r="24" fill="#EDE9FE" stroke="#C4B5FD" stroke-width="1.5" filter="url(#s)"/>
  <text x="52" y="115" text-anchor="middle" font-size="14" fill="#5B21B6">&#128269;</text>
  <text x="52" y="130" text-anchor="middle" font-size="7" font-weight="700" fill="#5B21B6">REVIEWER</text>
  <text x="52" y="160" text-anchor="middle" font-size="9" fill="#94A3B8">1</text>

  <!-- Arrow 1-2 -->
  <line x1="80" y1="118" x2="108" y2="118" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Step 2: Review Contents -->
  <rect x="116" y="94" width="116" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="116" y="94" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="178" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Review skill</text>
  <text x="178" y="130" text-anchor="middle" font-size="10" fill="#64748B">contents</text>
  <text x="178" y="160" text-anchor="middle" font-size="9" fill="#94A3B8">2</text>

  <!-- Arrow 2-3 -->
  <line x1="238" y1="118" x2="266" y2="118" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Step 3: Build Statement -->
  <rect x="274" y="94" width="118" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="274" y="94" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="337" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Build attestation</text>
  <text x="337" y="130" text-anchor="middle" font-size="10" fill="#64748B">statement</text>
  <text x="337" y="160" text-anchor="middle" font-size="9" fill="#94A3B8">3</text>

  <!-- Arrow 3-4 -->
  <line x1="398" y1="118" x2="426" y2="118" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Step 4: Canonical + Sign -->
  <rect x="434" y="94" width="130" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="434" y="94" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="503" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Canonical JSON</text>
  <text x="503" y="130" text-anchor="middle" font-size="10" fill="#64748B">+ GPG sign</text>
  <text x="503" y="160" text-anchor="middle" font-size="9" fill="#94A3B8">4</text>

  <!-- Arrow 4-5 -->
  <line x1="570" y1="118" x2="598" y2="118" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr-b)"/>

  <!-- Step 5: .attestation.json -->
  <rect x="606" y="94" width="130" height="48" rx="6" fill="#DBEAFE" stroke="#93C5FD" filter="url(#s)"/>
  <text x="671" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">.attestation</text>
  <text x="671" y="130" text-anchor="middle" font-size="10" fill="#3B82F6">.json</text>
  <text x="671" y="160" text-anchor="middle" font-size="9" fill="#94A3B8">5</text>

  <!-- Arrow 5 to Publish (down) -->
  <line x1="671" y1="148" x2="671" y2="178" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr-a)"/>

  <!-- ═══ Row 2: PUBLISH PHASE (Step 6 — 3 paths) ═══ -->

  <!-- Publish hub -->
  <rect x="618" y="186" width="106" height="36" rx="6" fill="#FEF3C7" stroke="#FDE68A" filter="url(#s)"/>
  <text x="671" y="209" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Publish</text>
  <text x="671" y="232" text-anchor="middle" font-size="9" fill="#94A3B8">6</text>

  <!-- Three publish paths (fan out left, center, right) -->
  <!-- Local path -->
  <line x1="638" y1="222" x2="578" y2="252" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-a)"/>
  <rect x="528" y="258" width="100" height="32" rx="6" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="578" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Local file</text>

  <!-- Repo path -->
  <line x1="671" y1="222" x2="671" y2="252" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-a)"/>
  <rect x="621" y="258" width="100" height="32" rx="6" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="671" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Git repo</text>

  <!-- URL path -->
  <line x1="704" y1="222" x2="764" y2="252" stroke="#D97706" stroke-width="1.2" marker-end="url(#arr-a)"/>
  <rect x="714" y="258" width="100" height="32" rx="6" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="764" y="278" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Remote URL</text>

  <!-- ═══ Row 1 continued: VERIFY PHASE (Steps 7-9, right side) ═══ -->

  <!-- Converge arrow from publish paths back up to verify chain -->
  <!-- Arrow from publish hub rightward to step 7 -->
  <line x1="724" y1="204" x2="774" y2="204" stroke="#059669" stroke-width="1.5"/>
  <line x1="774" y1="204" x2="774" y2="118" stroke="#059669" stroke-width="1.5"/>
  <line x1="774" y1="118" x2="798" y2="118" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step 7: Fetch Key + Verify Sig -->
  <rect x="806" y="94" width="120" height="48" rx="6" fill="#fff" stroke="#BBF7D0" filter="url(#s)"/>
  <rect x="806" y="94" width="4" height="48" rx="2 0 0 2" fill="#059669"/>
  <text x="870" y="115" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Fetch key</text>
  <text x="870" y="130" text-anchor="middle" font-size="10" fill="#64748B">+ verify sig</text>
  <text x="870" y="160" text-anchor="middle" font-size="9" fill="#94A3B8">7</text>

  <!-- Arrow 7 down to results -->
  <line x1="866" y1="148" x2="866" y2="186" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step 8: Compare Digests -->
  <rect x="806" y="194" width="120" height="48" rx="6" fill="#fff" stroke="#BBF7D0" filter="url(#s)"/>
  <rect x="806" y="194" width="4" height="48" rx="2 0 0 2" fill="#059669"/>
  <text x="870" y="215" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Compare</text>
  <text x="870" y="230" text-anchor="middle" font-size="10" fill="#64748B">digests</text>
  <text x="870" y="258" text-anchor="middle" font-size="9" fill="#94A3B8">8</text>

  <!-- Arrow 8 down to results -->
  <line x1="866" y1="248" x2="866" y2="268" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Step 9: Results -->
  <rect x="830" y="276" width="72" height="28" rx="6" fill="#059669"/>
  <text x="866" y="294" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">VALID</text>

  <rect x="830" y="312" width="72" height="28" rx="6" fill="#F59E0B"/>
  <text x="866" y="330" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">STALE</text>

  <rect x="830" y="348" width="72" height="28" rx="6" fill="#DC2626"/>
  <text x="866" y="366" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">INVALID</text>

  <text x="866" y="392" text-anchor="middle" font-size="9" fill="#94A3B8">9</text>

  <!-- Phase labels -->
  <rect x="16" y="340" width="556" height="22" rx="4" fill="#EFF6FF" opacity="0.5"/>
  <text x="294" y="355" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">CREATE ATTESTATION</text>
  <rect x="580" y="340" width="244" height="22" rx="4" fill="#FFFBEB" opacity="0.5"/>
  <text x="702" y="355" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E" letter-spacing="0.5">PUBLISH</text>

  <!-- Footer -->
  <text x="480" y="408" text-anchor="middle" font-size="10" fill="#94A3B8">SkillSeal  ·  Cryptographic Trust for LLM Agent Skills</text>
</svg>