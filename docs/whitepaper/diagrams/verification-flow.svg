<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#2563EB"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#059669"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#DC2626"/>
    </marker>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="960" height="310" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" letter-spacing="0.5">Verification Flow</text>
  <rect x="340" y="38" width="280" height="1.5" fill="url(#hdr)" rx="1"/>
  <text x="480" y="56" text-anchor="middle" font-size="12" fill="#64748B">From TRUST.json to a deterministic trust decision</text>

  <!-- Step 1: Read TRUST.json -->
  <rect x="16" y="88" width="112" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="16" y="88" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="76" y="109" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Read</text>
  <text x="76" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">TRUST.json</text>
  <text x="76" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">1</text>

  <!-- Arrow -->
  <line x1="134" y1="112" x2="158" y2="112" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2: Fetch GPG Key -->
  <rect x="166" y="88" width="110" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="166" y="88" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="225" y="109" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Fetch GPG key</text>
  <text x="225" y="124" text-anchor="middle" font-size="10" fill="#64748B">from GitHub</text>
  <text x="225" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">2</text>

  <!-- Arrow -->
  <line x1="282" y1="112" x2="306" y2="112" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3: Fingerprint Check -->
  <rect x="314" y="88" width="116" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="314" y="88" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="376" y="109" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Fingerprint</text>
  <text x="376" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">check</text>
  <text x="376" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">3</text>

  <!-- Arrow -->
  <line x1="436" y1="112" x2="460" y2="112" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 4: Verify Signature -->
  <rect x="468" y="88" width="114" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="468" y="88" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="529" y="109" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Verify GPG</text>
  <text x="529" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">signature</text>
  <text x="529" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">4</text>

  <!-- Arrow -->
  <line x1="588" y1="112" x2="612" y2="112" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 5: Verify Manifest -->
  <rect x="620" y="88" width="110" height="48" rx="6" fill="#fff" stroke="#BFDBFE" filter="url(#s)"/>
  <rect x="620" y="88" width="4" height="48" rx="2 0 0 2" fill="#2563EB"/>
  <text x="679" y="109" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">Verify</text>
  <text x="679" y="124" text-anchor="middle" font-size="11" font-weight="600" fill="#1E293B">manifest</text>
  <text x="679" y="152" text-anchor="middle" font-size="9" fill="#94A3B8">5</text>

  <!-- Arrow -->
  <line x1="736" y1="112" x2="760" y2="112" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 6: Policy Decision (diamond) -->
  <polygon points="810,78 860,112 810,146 760,112" fill="#fff" stroke="#C4B5FD" stroke-width="1.5" filter="url(#s)"/>
  <text x="810" y="109" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">Policy</text>
  <text x="810" y="121" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">check</text>
  <text x="810" y="164" text-anchor="middle" font-size="9" fill="#94A3B8">6</text>

  <!-- Arrow to ALLOW -->
  <line x1="860" y1="100" x2="886" y2="84" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <!-- Arrow to BLOCK -->
  <line x1="860" y1="124" x2="886" y2="140" stroke="#DC2626" stroke-width="1.5" marker-end="url(#arr-r)"/>

  <!-- ALLOW box -->
  <rect x="892" y="64" width="52" height="36" rx="6" fill="#059669"/>
  <text x="918" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">ALLOW</text>

  <!-- BLOCK box -->
  <rect x="892" y="124" width="52" height="36" rx="6" fill="#DC2626"/>
  <text x="918" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">BLOCK</text>

  <!-- Phase labels -->
  <rect x="16" y="178" width="714" height="22" rx="4" fill="#EFF6FF" opacity="0.5"/>
  <text x="373" y="193" text-anchor="middle" font-size="10" font-weight="600" fill="#1E3A8A" letter-spacing="0.5">VERIFICATION PHASE</text>
  <rect x="742" y="178" width="202" height="22" rx="4" fill="#F5F3FF" opacity="0.5"/>
  <text x="843" y="193" text-anchor="middle" font-size="10" font-weight="600" fill="#5B21B6" letter-spacing="0.5">DECISION</text>

  <!-- Flow description -->
  <text x="480" y="228" text-anchor="middle" font-size="11" fill="#64748B">Any failure at steps 1-5 results in immediate BLOCK (fail-closed model)</text>

  <!-- Footer -->
  <text x="480" y="290" text-anchor="middle" font-size="10" fill="#94A3B8">SkillSeal  ·  Cryptographic Trust for LLM Agent Skills</text>
</svg>