<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#2563EB"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0 0 L10 4 L0 8z" fill="#059669"/>
    </marker>
    <filter id="s"><feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.07"/></filter>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706" stop-opacity="0"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="740" height="520" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="370" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1E293B" letter-spacing="0.5">Trust Model</text>
  <rect x="240" y="38" width="260" height="1.5" fill="url(#hdr)" rx="1"/>
  <text x="370" y="56" text-anchor="middle" font-size="12" fill="#64748B">Three paths to trust — any one is sufficient</text>

  <!-- ═══ Path 1: Trusted Author ═══ -->
  <rect x="24" y="80" width="692" height="108" rx="8" fill="#fff" stroke="#E2E8F0" filter="url(#s)"/>
  <rect x="24" y="80" width="692" height="4" rx="2 2 0 0" fill="#2563EB"/>

  <rect x="40" y="92" width="120" height="20" rx="10" fill="#EFF6FF"/>
  <text x="100" y="106" text-anchor="middle" font-size="11" font-weight="700" fill="#1E3A8A">Path 1</text>
  <text x="178" y="106" font-size="12" font-weight="600" fill="#1E293B">Trusted Author</text>

  <!-- Author signs → You trust author → Skill runs -->
  <rect x="48" y="124" width="126" height="44" rx="6" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="111" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">Author signs skill</text>
  <text x="111" y="158" text-anchor="middle" font-size="10" fill="#3B82F6">GPG signature</text>

  <line x1="180" y1="146" x2="224" y2="146" stroke="#2563EB" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="232" y="124" width="164" height="44" rx="6" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="314" y="144" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">You add author</text>
  <text x="314" y="158" text-anchor="middle" font-size="10" fill="#3B82F6">to trust store</text>

  <line x1="402" y1="146" x2="446" y2="146" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="454" y="130" width="96" height="32" rx="6" fill="#059669"/>
  <text x="502" y="151" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Skill runs</text>

  <!-- ═══ Path 2: Trusted Attester, Signed Skill ═══ -->
  <rect x="24" y="208" width="692" height="108" rx="8" fill="#fff" stroke="#E2E8F0" filter="url(#s)"/>
  <rect x="24" y="208" width="692" height="4" rx="2 2 0 0" fill="#7C3AED"/>

  <rect x="40" y="220" width="120" height="20" rx="10" fill="#F5F3FF"/>
  <text x="100" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#5B21B6">Path 2</text>
  <text x="178" y="234" font-size="12" font-weight="600" fill="#1E293B">Trusted Attester, Signed Skill</text>

  <rect x="48" y="252" width="108" height="44" rx="6" fill="#DBEAFE" stroke="#93C5FD"/>
  <text x="102" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#1E3A8A">Author signs</text>
  <text x="102" y="286" text-anchor="middle" font-size="10" fill="#3B82F6">skill</text>

  <line x1="162" y1="274" x2="186" y2="274" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="194" y="252" width="120" height="44" rx="6" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="254" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">Reviewer</text>
  <text x="254" y="286" text-anchor="middle" font-size="10" fill="#7C3AED">attests skill</text>

  <line x1="320" y1="274" x2="344" y2="274" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="352" y="252" width="130" height="44" rx="6" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="417" y="272" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">You trust</text>
  <text x="417" y="286" text-anchor="middle" font-size="10" fill="#7C3AED">the reviewer</text>

  <line x1="488" y1="274" x2="512" y2="274" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="520" y="258" width="96" height="32" rx="6" fill="#059669"/>
  <text x="568" y="279" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Skill runs</text>

  <!-- ═══ Path 3: Trusted Attester, Unsigned Skill ═══ -->
  <rect x="24" y="336" width="692" height="128" rx="8" fill="#fff" stroke="#E2E8F0" filter="url(#s)"/>
  <rect x="24" y="336" width="692" height="4" rx="2 2 0 0" fill="#D97706"/>

  <rect x="40" y="348" width="120" height="20" rx="10" fill="#FFFBEB"/>
  <text x="100" y="362" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">Path 3</text>
  <text x="178" y="362" font-size="12" font-weight="600" fill="#1E293B">Trusted Attester, Unsigned Skill</text>

  <rect x="48" y="380" width="108" height="44" rx="6" fill="#FEF3C7" stroke="#FDE68A"/>
  <text x="102" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#92400E">Author publishes</text>
  <text x="102" y="412" text-anchor="middle" font-size="10" fill="#B45309">unsigned skill</text>

  <line x1="162" y1="402" x2="186" y2="402" stroke="#D97706" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="194" y="380" width="120" height="44" rx="6" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="254" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">Reviewer</text>
  <text x="254" y="412" text-anchor="middle" font-size="10" fill="#7C3AED">attests skill</text>

  <line x1="320" y1="402" x2="344" y2="402" stroke="#7C3AED" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="352" y="380" width="130" height="44" rx="6" fill="#EDE9FE" stroke="#C4B5FD"/>
  <text x="417" y="398" text-anchor="middle" font-size="11" font-weight="600" fill="#5B21B6">You trust</text>
  <text x="417" y="412" text-anchor="middle" font-size="10" fill="#7C3AED">the reviewer</text>

  <line x1="488" y1="402" x2="512" y2="402" stroke="#059669" stroke-width="1.5" marker-end="url(#arr-g)"/>

  <rect x="520" y="386" width="96" height="32" rx="6" fill="#059669"/>
  <text x="568" y="407" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Skill runs</text>

  <text x="370" y="448" text-anchor="middle" font-size="10" fill="#64748B" font-style="italic">Attestation pins exact content by SHA-256 digest and git commit</text>

  <!-- Footer -->
  <text x="370" y="504" text-anchor="middle" font-size="10" fill="#94A3B8">SkillSeal  ·  Cryptographic Trust for LLM Agent Skills</text>
</svg>